  <script>
document.addEventListener("DOMContentLoaded", () => {
  const sections = document.querySelectorAll(".js-curtain-section");

  sections.forEach((section) => {
    const overlay = section.querySelector(".pf-overlay");
    const carousel = section.querySelector("[data-carousel]");
    if (!overlay || !carousel) return;

    // ----- Carousel -----
    const slides = Array.from(carousel.querySelectorAll("[data-slide]"));
    const prevBtn = carousel.querySelector("[data-prev]");
    const nextBtn = carousel.querySelector("[data-next]");

    let index = slides.findIndex(s => s.classList.contains("is-active"));
    if (index < 0) index = 0;

    const pauseAllVideos = () => {
      slides.forEach(slide => {
        const v = slide.querySelector("video");
        if (v) v.pause();
      });
    };

    const show = (newIndex) => {
      pauseAllVideos();
      slides[index].classList.remove("is-active");
      index = (newIndex + slides.length) % slides.length;
      slides[index].classList.add("is-active");
    };

    prevBtn?.addEventListener("click", () => show(index - 1));
    nextBtn?.addEventListener("click", () => show(index + 1));

    // ----- Video starter først når overlay er væk -----
    const firstVideo = slides[0]?.querySelector("video");
    if (firstVideo) {
      firstVideo.pause();

      const startVideoOnce = (e) => {
        if (e.propertyName !== "transform") return;
        overlay.removeEventListener("transitionend", startVideoOnce);
        firstVideo.play().catch(() => {});
      };

      overlay.addEventListener("transitionend", startVideoOnce);
    }

    // ----- Curtain drop når sektionen er i view (tweakbar) -----
    let hasDropped = false;

    const isReadyToDrop = () => {
      const rect = section.getBoundingClientRect();
      const tol = 20;

      // “næsten 100%” — gør tidligere ved at øge tol eller lav procent-metode
      return rect.top >= 0 - tol && rect.bottom <= window.innerHeight + tol;
    };

    const tryDrop = () => {
      if (hasDropped) return;

      if (isReadyToDrop()) {
        hasDropped = true;
        const delayMs = 100; // justér her
        setTimeout(() => overlay.classList.add("is-hidden"), delayMs);

        window.removeEventListener("scroll", tryDrop);
        window.removeEventListener("resize", tryDrop);
      }
    };

    window.addEventListener("scroll", tryDrop, { passive: true });
    window.addEventListener("resize", tryDrop);
    tryDrop();
  });
});

/* ===== Cylinder gallery (fixed) ===== */
(() => {
  // Simple safeInit fallback (only runs once per key)
  const __inited = new Set();
  function safeInit(key, fn) {
    if (__inited.has(key)) return;
    __inited.add(key);
    try { fn(); } catch (err) { console.error(`[${key}] init error`, err); }
  }

  safeInit("cylinder", () => {
    const sec = document.querySelector("#cyl-sec");
    const cyl = document.querySelector("#cyl-cylinder");
    if (!sec || !cyl) return;

    const cards = Array.from(cyl.querySelectorAll(".cyl-card"));
    const count = cards.length;

    let rotY = 0;
    let rafId = 0;

    function layout() {
      const step = 360 / Math.max(1, count);
      cards.forEach((card, i) => {
        const a = i * step;
        card.style.transform =
          `translate(-50%, -50%) rotateY(${a}deg) translateZ(var(--radius))`;
      });
      scheduleRender();
    }

    function render() {
      rafId = 0;
      cyl.style.transform = `rotateX(var(--tiltX)) rotateY(${rotY}deg)`;
    }

    function scheduleRender() {
      if (rafId) return;
      rafId = requestAnimationFrame(render);
    }

    function isMostlyInView() {
      const r = sec.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      const mid = r.top + r.height * 0.5;
      return mid > 0 && mid < vh;
    }

    // --- Events ---
    const onResize = () => layout();

    const onWheel = (e) => {
      if (!isMostlyInView()) return;
      rotY += e.deltaY * 0.08;
      scheduleRender();
    };

    let dragging = false;
    let lastX = 0;

    const onPointerDown = (e) => {
      dragging = true;
      lastX = e.clientX;
      // Capture pointer so drag continues even if cursor leaves element
      if (sec.setPointerCapture) sec.setPointerCapture(e.pointerId);
    };

    const onPointerMove = (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      lastX = e.clientX;
      rotY += dx * 0.25;
      scheduleRender();
    };

    const stopDrag = () => { dragging = false; };

    // Attach
    window.addEventListener("resize", onResize);
    window.addEventListener("wheel", onWheel, { passive: true });

    sec.addEventListener("pointerdown", onPointerDown);
    sec.addEventListener("pointermove", onPointerMove);
    sec.addEventListener("pointerup", stopDrag);
    sec.addEventListener("pointercancel", stopDrag);
    sec.addEventListener("pointerleave", stopDrag);

    // Initial
    layout();
    render();

    // Optional: expose a cleanup if you need it later
    // (e.g. single-page apps)
    sec.__cylCleanup = () => {
      window.removeEventListener("resize", onResize);
      window.removeEventListener("wheel", onWheel, { passive: true });

      sec.removeEventListener("pointerdown", onPointerDown);
      sec.removeEventListener("pointermove", onPointerMove);
      sec.removeEventListener("pointerup", stopDrag);
      sec.removeEventListener("pointercancel", stopDrag);
      sec.removeEventListener("pointerleave", stopDrag);
    };
  });
})();

  </script>
