<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Et visuelt indblik i mit internship hos AY Studios.">
  <title>Internship hos AY Studios | Portfolio</title>

  <link rel="stylesheet" href="internship-ay.css">
  <link rel="stylesheet" href="custom-cursor.css">
  <link rel="stylesheet" href="https://use.typekit.net/vjb1ziv.css">
  <script src="custom-cursor.js" defer></script>
  <script src="ay-collage.js" defer></script>
  <link rel="icon" type="image/png" href="billeder/favicon.png">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="top">
        <div class="logo">
          <a href="index.html" aria-label="Gå til forsiden">
            <img src="billeder/logo.svg" alt="Logo">
          </a>
        </div>

        <nav class="menu" aria-label="Hovedmenu">
          <a href="projekter.html">Mine projekter</a>
          <a href="kontakt.html">Kontakt</a>
        </nav>
      </div>
    </aside>

    <main class="content">
      <section class="ay-scroll-section" aria-label="Visuelt indblik i AY Studios">
        <div class="ay-stage">
          <img class="ay-photo ay-photo--one" src="billeder/ayforside.jpg" alt="Visuelt arbejde fra AY Studios">
          <video class="ay-photo ay-photo--two" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
            <source src="video/aykigop.mp4" type="video/mp4">
          </video>
          <img class="ay-photo ay-photo--three" src="billeder/ayligge.jpg" alt="Visuelt indhold fra et studieprojekt">
          <video class="ay-photo ay-photo--four" data-trim-end="2" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
            <source src="video/aywalk.mp4" type="video/mp4">
          </video>
          <img class="ay-photo ay-photo--five" src="billeder/aywalk.jpg" alt="Redaktionelt modeindhold">

          <div class="ay-scroll-text">
            <img src="billeder/follow.png" alt="AY Studios">
          </div>
        </div>
      </section>
     

    </main>
  </div>
</body>
</html>
