<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Et visuelt indblik i mit internship hos AY Studios.">
  <title>Internship hos AY Studios | Portfolio</title>

  <link rel="stylesheet" href="internship-ay.css">
  <link rel="stylesheet" href="custom-cursor.css">
  <link rel="stylesheet" href="https://use.typekit.net/vjb1ziv.css">
  <script src="custom-cursor.js" defer></script>
  <script src="ay-collage.js" defer></script>
  <link rel="icon" type="image/png" href="billeder/favicon.png">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="top">
        <div class="logo">
          <a href="index.html" aria-label="Gå til forsiden">
            <img src="billeder/logo.svg" alt="Logo">
          </a>
        </div>

        <nav class="menu" aria-label="Hovedmenu">
          <a href="projekter.html">Mine projekter</a>
          <a href="kontakt.html">Kontakt</a>
        </nav>
      </div>
    </aside>

    <main class="content">
      <section class="ay-scroll-section" aria-label="Visuelt indblik i AY Studios">
        <div class="ay-stage">
          <img class="ay-photo ay-photo--one" src="billeder/ayforside.jpg" alt="Visuelt arbejde fra AY Studios">
          <video class="ay-photo ay-photo--two" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
            <source src="video/aykigop.mp4" type="video/mp4">
          </video>
          <img class="ay-photo ay-photo--three" src="billeder/ayligge.jpg" alt="Visuelt indhold fra et studieprojekt">
          <video class="ay-photo ay-photo--four" data-trim-end="2" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
            <source src="video/aywalk.mp4" type="video/mp4">
          </video>
          <img class="ay-photo ay-photo--five" src="billeder/aywalk.jpg" alt="Redaktionelt modeindhold">

          <div class="ay-scroll-text">
            <img src="billeder/follow.png" alt="AY Studios">
          </div>
        </div>
      </section>
      <section class="ay-video-stage">
        <section class="ay-video-gallery" aria-label="AY Studios SoMe ">
          <div class="ay-video-gallery__track" tabindex="0" aria-label="Vandret videokarrusel">
            <div class="ay-video-card">
              <video class="ay-video--rotated" muted loop playsinline preload="metadata" aria-label="AY Studios-video 1">
                <source src="video/security.mp4" type="video/mp4">
              </video>
              <button class="ay-video-card__preview" type="button" aria-label="Afspil AY Studios-video 1" aria-pressed="false">
                <span class="ay-video-card__play-icon" aria-hidden="true"></span>
              </button>
            </div>
            <div class="ay-video-card">
              <video class="ay-video--rotated" muted loop playsinline preload="metadata" aria-label="AY Studios-video 2">
                <source src="video/Security-women.mp4" type="video/mp4">
              </video>
              <button class="ay-video-card__preview" type="button" aria-label="Afspil AY Studios-video 2" aria-pressed="false">
                <span class="ay-video-card__play-icon" aria-hidden="true"></span>
              </button>
            </div>
            <div class="ay-video-card">
              <video muted loop playsinline preload="metadata" aria-label="AY Studios-video 3">
                <source src="video/Trolley-Black.mp4" type="video/mp4">
              </video>
              <button class="ay-video-card__preview" type="button" aria-label="Afspil AY Studios-video 3" aria-pressed="false">
                <span class="ay-video-card__play-icon" aria-hidden="true"></span>
              </button>
            </div>
            <div class="ay-video-card">
              <video muted loop playsinline preload="metadata" aria-label="AY Studios-video 4">
                <source src="video/Trolley-Black.mp4" type="video/mp4">
              </video>
              <button class="ay-video-card__preview" type="button" aria-label="Afspil AY Studios-video 4" aria-pressed="false">
                <span class="ay-video-card__play-icon" aria-hidden="true"></span>
              </button>
            </div>
            <div class="ay-video-card">
              <video muted loop playsinline preload="metadata" aria-label="AY Studios-video 5">
                <source src="video/Weekendbagom.mp4" type="video/mp4">
              </video>
              <button class="ay-video-card__preview" type="button" aria-label="Afspil AY Studios-video 5" aria-pressed="false">
                <span class="ay-video-card__play-icon" aria-hidden="true"></span>
              </button>
            </div>
            <div class="ay-video-card">
              <video muted loop playsinline preload="metadata" aria-label="AY Studios-video 6">
                <source src="video/security.mp4" type="video/mp4">
              </video>
              <button class="ay-video-card__preview" type="button" aria-label="Afspil AY Studios-video 6" aria-pressed="false">
                <span class="ay-video-card__play-icon" aria-hidden="true"></span>
              </button>
            </div>
            <div class="ay-video-card">
              <video muted loop playsinline preload="metadata" aria-label="AY Studios-video 7">
                <source src="video/aywalk.mp4" type="video/mp4">
              </video>
              <button class="ay-video-card__preview" type="button" aria-label="Afspil AY Studios-video 7" aria-pressed="false">
                <span class="ay-video-card__play-icon" aria-hidden="true"></span>
              </button>
            </div>
            <div class="ay-video-card">
              <video muted loop playsinline preload="metadata" aria-label="AY Studios-video 8">
                <source src="video/aykigop.mp4" type="video/mp4">
              </video>
              <button class="ay-video-card__preview" type="button" aria-label="Afspil AY Studios-video 8" aria-pressed="false">
                <span class="ay-video-card__play-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <dialog class="ay-video-lightbox" aria-label="Video fra AY Studios">
            <button class="ay-video-lightbox__close" type="button" aria-label="Luk video">&times;</button>
          </dialog>
          <div class="ay-video-overlay" aria-hidden="true">
            <h2>Videoer til SoMe</h2>
          </div>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
